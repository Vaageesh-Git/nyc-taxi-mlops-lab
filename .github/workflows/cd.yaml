name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (default: sha-<git_sha_7> of HEAD)"
        required: false
      rollback:
        description: "Roll back to the other color without deploying"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, lab-app]
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy or Rollback
        env:
          INPUT_TAG: ${{ inputs.tag }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          deploy/web.sh prepare

          if [ "$ROLLBACK" = "true" ]; then
            LIVE=$(deploy/web.sh live)
            if [ "$LIVE" = "blue" ]; then
              TARGET="green"
            elif [ "$LIVE" = "green" ]; then
              TARGET="blue"
            else
              echo "No live color currently running to roll back from" >&2
              exit 1
            fi
            echo "Rolling back traffic from $LIVE to $TARGET"
            deploy/web.sh smoke "$TARGET"
            deploy/web.sh switch "$TARGET"
            deploy/web.sh status
            exit 0
          fi

          if [ -n "$INPUT_TAG" ]; then
            IMAGE_TAG="$INPUT_TAG"
            EXPECTED_SHA=""
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            IMAGE_TAG="sha-${HEAD_SHA:0:7}"
            EXPECTED_SHA="$HEAD_SHA"
          else
            IMAGE_TAG="sha-${GITHUB_SHA::7}"
            EXPECTED_SHA="$GITHUB_SHA"
          fi
          export IMAGE_TAG

          LIVE=$(deploy/web.sh live)
          if [ "$LIVE" = "blue" ]; then
            TARGET="green"
          else
            TARGET="blue"
          fi

          echo "Live color: $LIVE -> Deploying new tag $IMAGE_TAG to idle color: $TARGET"

          # Determine tags for both colors to keep the non-target color intact
          BLUE_TAG=$(deploy/web.sh tag blue)
          GREEN_TAG=$(deploy/web.sh tag green)

          if [ "$TARGET" = "blue" ]; then
            BLUE_TAG="$IMAGE_TAG"
            [ "$GREEN_TAG" = "none" ] && GREEN_TAG="$IMAGE_TAG"
          else
            GREEN_TAG="$IMAGE_TAG"
            [ "$BLUE_TAG" = "none" ] && BLUE_TAG="$IMAGE_TAG"
          fi
          export BLUE_TAG GREEN_TAG

          echo "Deploying app-$TARGET ($IMAGE_TAG)..."
          docker compose -f deploy/compose.web.yaml pull "app-$TARGET"
          docker compose -f deploy/compose.web.yaml up -d --remove-orphans traefik "app-$TARGET"

          echo "Smoke testing target color $TARGET..."
          deploy/web.sh smoke "$TARGET" "$EXPECTED_SHA"

          echo "Switching live traffic to $TARGET..."
          deploy/web.sh switch "$TARGET"

          echo "Deployment complete. Final status:"
          deploy/web.sh status
