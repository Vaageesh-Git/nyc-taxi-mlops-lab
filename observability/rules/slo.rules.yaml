# SLO recording and alerting rules (S5, decision 013), evaluated by your Grafana Cloud stack's ruler.
# Prometheus rule format: https://prometheus.io/docs/prometheus/latest/configuration/recording_rules/
# Metric names are contracts/metrics.yaml's. `make check` runs promtool on this file and on any
# *.test.yaml next to it.
groups:
  - name: slo-predict-availability
    rules:
      # Predict Availability SLI: error = fallback / total
      - record: job:predict_requests:rate5m
        expr: sum(rate(lab_predictions_total[5m]))
      - record: job:predict_errors:rate5m
        expr: sum(rate(lab_predictions_total{source="fallback"}[5m]))
      - record: job:predict_error:ratio_rate5m
        expr: job:predict_errors:rate5m / job:predict_requests:rate5m

      - record: job:predict_requests:rate30m
        expr: sum(rate(lab_predictions_total[30m]))
      - record: job:predict_errors:rate30m
        expr: sum(rate(lab_predictions_total{source="fallback"}[30m]))
      - record: job:predict_error:ratio_rate30m
        expr: job:predict_errors:rate30m / job:predict_requests:rate30m

      - record: job:predict_requests:rate1h
        expr: sum(rate(lab_predictions_total[1h]))
      - record: job:predict_errors:rate1h
        expr: sum(rate(lab_predictions_total{source="fallback"}[1h]))
      - record: job:predict_error:ratio_rate1h
        expr: job:predict_errors:rate1h / job:predict_requests:rate1h

      - record: job:predict_requests:rate6h
        expr: sum(rate(lab_predictions_total[6h]))
      - record: job:predict_errors:rate6h
        expr: sum(rate(lab_predictions_total{source="fallback"}[6h]))
      - record: job:predict_error:ratio_rate6h
        expr: job:predict_errors:rate6h / job:predict_requests:rate6h

      # Alerts: Multi-window multi-burn-rate for 99.0% SLO (budget = 0.01)
      # Fast burn: 14.4x over 1h and 5m (burns 2% of budget in 1 hour)
      - alert: PredictAvailabilityBurnRateCritical
        expr: job:predict_error:ratio_rate1h > (14.4 * 0.01) and job:predict_error:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels:
          severity: critical
          slo: predict-availability
        annotations:
          summary: "Predict availability error budget burning fast (14.4x over 1h/5m)"
          description: "High proportion of predictions are falling back to static median."

      # Slow burn: 6x over 6h and 30m (burns 5% of budget in 6 hours)
      - alert: PredictAvailabilityBurnRateWarning
        expr: job:predict_error:ratio_rate6h > (6 * 0.01) and job:predict_error:ratio_rate30m > (6 * 0.01)
        for: 15m
        labels:
          severity: warning
          slo: predict-availability
        annotations:
          summary: "Predict availability error budget burning slowly (6x over 6h/30m)"
          description: "Persistent elevated fallback rate threatening 30-day SLO."

  - name: slo-predict-latency
    rules:
      # Predict Latency SLI (target 250ms): error = requests > 0.25s / total /predict requests
      - record: job:predict_latency_requests:rate5m
        expr: sum(rate(lab_http_request_duration_seconds_count{route="/predict"}[5m]))
      - record: job:predict_latency_errors:rate5m
        expr: sum(rate(lab_http_request_duration_seconds_count{route="/predict"}[5m])) - sum(rate(lab_http_request_duration_seconds_bucket{route="/predict",le="0.25"}[5m]))
      - record: job:predict_latency_error:ratio_rate5m
        expr: job:predict_latency_errors:rate5m / job:predict_latency_requests:rate5m

      - record: job:predict_latency_requests:rate30m
        expr: sum(rate(lab_http_request_duration_seconds_count{route="/predict"}[30m]))
      - record: job:predict_latency_errors:rate30m
        expr: sum(rate(lab_http_request_duration_seconds_count{route="/predict"}[30m])) - sum(rate(lab_http_request_duration_seconds_bucket{route="/predict",le="0.25"}[30m]))
      - record: job:predict_latency_error:ratio_rate30m
        expr: job:predict_latency_errors:rate30m / job:predict_latency_requests:rate30m

      - record: job:predict_latency_requests:rate1h
        expr: sum(rate(lab_http_request_duration_seconds_count{route="/predict"}[1h]))
      - record: job:predict_latency_errors:rate1h
        expr: sum(rate(lab_http_request_duration_seconds_count{route="/predict"}[1h])) - sum(rate(lab_http_request_duration_seconds_bucket{route="/predict",le="0.25"}[1h]))
      - record: job:predict_latency_error:ratio_rate1h
        expr: job:predict_latency_errors:rate1h / job:predict_latency_requests:rate1h

      - record: job:predict_latency_requests:rate6h
        expr: sum(rate(lab_http_request_duration_seconds_count{route="/predict"}[6h]))
      - record: job:predict_latency_errors:rate6h
        expr: sum(rate(lab_http_request_duration_seconds_count{route="/predict"}[6h])) - sum(rate(lab_http_request_duration_seconds_bucket{route="/predict",le="0.25"}[6h]))
      - record: job:predict_latency_error:ratio_rate6h
        expr: job:predict_latency_errors:rate6h / job:predict_latency_requests:rate6h

      # Latency fast burn: 14.4x budget (for 95% latency SLO, budget = 0.05, 14.4 * 0.05 = 0.72)
      - alert: PredictLatencyBurnRateCritical
        expr: job:predict_latency_error:ratio_rate1h > (14.4 * 0.05) and job:predict_latency_error:ratio_rate5m > (14.4 * 0.05)
        for: 2m
        labels:
          severity: critical
          slo: predict-latency
        annotations:
          summary: "Predict latency error budget burning fast"
          description: "Elevated latency on /predict exceeding 250ms."

      - alert: PredictLatencyBurnRateWarning
        expr: job:predict_latency_error:ratio_rate6h > (6 * 0.05) and job:predict_latency_error:ratio_rate30m > (6 * 0.05)
        for: 15m
        labels:
          severity: warning
          slo: predict-latency
        annotations:
          summary: "Predict latency error budget burning slowly"
          description: "Persistent latency degradation on /predict exceeding 250ms."
